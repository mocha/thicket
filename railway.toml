# Railway: build the same Dockerfile every other deploy uses, and only send
# traffic to a container once thicket says it is healthy. /api/health answers
# after migrations have run on boot, so a deploy with a broken migration never
# takes over from the one that works.
#
# ONE service, ONE replica. thicket is a single container: the API serves the
# built web app and runs the feed fetcher (SCHEDULER=on). Railway's monorepo
# detection will happily offer a service per package — @thicket/web and
# @thicket/api — and every service reading this file would be a second full
# app and a second fetcher polling every feed twice. Scale out by adding
# replicas with SCHEDULER=off, never by adding services.
#
# Railway sets PORT; thicket reads it. Required variables: DATABASE_URL and
# PUBLIC_URL (see .env.example and docs/DEPLOY.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The whole repo: API, web, and migrations all ship in the one image. The
# auto-detected "/packages/web/**" would skip every API-only change.
watchPatterns = ["**"]

[deploy]
# Stated explicitly because a start command set in the dashboard overrides the
# image's CMD — and monorepo detection sets one ("pnpm --filter @thicket/web
# dev") that runs the web dev server instead of thicket.
startCommand = "node --enable-source-maps dist/index.js"
numReplicas = 1
healthcheckPath = "/api/health"
# Generous on purpose: the first boot against a restored database runs any
# pending migrations before the health check can pass.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
