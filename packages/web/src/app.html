<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<!-- Light/dark and the reading font are chosen per device and kept in this
		     browser (see lib/theme.svelte.ts). Read them here, before anything paints,
		     so a dark reader is never flashed a white page on the way in. -->
		<script>
			try {
				var t = localStorage.getItem('thicket:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				var f = localStorage.getItem('thicket:font');
				if (f === 'serif' || f === 'dyslexic') document.documentElement.dataset.font = f;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
